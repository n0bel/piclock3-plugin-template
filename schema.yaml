# The shape of what config.yaml holds, and what each setting is.
# Required: without it the clock refuses to load the plugin, and --check
# says which one is missing.
#
# `description:` is required, and so is a `help:` on every setting - whole
# sentences saying what it is, which an editor shows beside it and --check
# shows after a wrong value.  The rest under settings: buys a spelling
# check and a value check for whoever writes a config, which is the reason
# to write it.

description: >
  A line of text in a region, redrawn on a timer.  The template plugin -
  replace this with what yours does.

settings:

  text:
    is: string
    help: The words drawn.  A name in braces is filled in, such as
      {location.latitude}.
  refresh:
    is: number
    unit: seconds
    range: [1, 86400]
    help: How often the text is drawn again.
  font-size:
    is: font-size
    help: How tall the words are, as a fraction of the region's height or
      as a measure such as 20px.

# A provider says what it answers here instead of drawing anything, and
# its class inherits the role that answers it:
#
#   provides: [conditions, hourly, daily]   Weather
#   provides: [map]                         BaseMap
#   provides: [frames]                      Frames
#   provides: [text]                        TextSource
#
# Saying it is what makes an entry a provider rather than a widget, and
# --check tells anyone who writes it in the wrong section.

# For the provider half, ExampleSource.py:
#
# provides: [text]
#
# settings:
#   lines:
#     is: list
#     help: The lines it supplies, one at a time, in turn.
#   refresh:
#     is: number
#     unit: seconds
#     range: [1, 86400]
#     help: How often it moves on to the next line.
