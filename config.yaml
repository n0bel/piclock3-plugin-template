# The defaults for this plugin, and the whole list of what a config or a
# theme may set on it.  A name that is not here is not a setting: the
# clock merges the user's over these, and --check says so when one is
# misspelled.
#
# What each setting is goes in its help: in schema.yaml.  A comment here
# says only why a default is that value, where somebody might ask.

# which kind this is.  A theme reaches every instance of a kind at once -
# `kind-settings: example:` - so pick a word for what the thing is rather
# than for what you called it.
kind: example

text: 'Hello from {location.latitude}, {location.longitude}'

refresh: 60

font-size: 0.3

# ---------------------------------------------------------------------
# The provider half of this template, for ExampleSource.py.  A provider
# has no region and no font: what it has is what it supplies.
#
# kind: text-source
#
# lines:
#   - 'The first thing it says'
#   - 'and the second, at {location.latitude}'
